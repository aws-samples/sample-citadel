version: 2
updates:
  # ── npm: root workspace ──
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # lucide-react major requires icon-name audit across all components
      - dependency-name: lucide-react
        update-types: ["version-update:semver-major"]
      # react-resizable-panels major has breaking API changes
      - dependency-name: react-resizable-panels
        update-types: ["version-update:semver-major"]
      # @visx packages must be upgraded together as a coordinated batch
      - dependency-name: "@visx/shape"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@visx/group"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@visx/responsive"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@visx/scale"
        update-types: ["version-update:semver-major"]
      # @types/node major tracks Node LTS; runtime is pinned to Node 24
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies

  # ── npm: frontend ──
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-frontend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # lucide-react major requires icon-name audit across all components
      - dependency-name: lucide-react
        update-types: ["version-update:semver-major"]
      # react-resizable-panels major has breaking API changes
      - dependency-name: react-resizable-panels
        update-types: ["version-update:semver-major"]
      # @visx packages must be upgraded together as a coordinated batch
      - dependency-name: "@visx/shape"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@visx/group"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@visx/responsive"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@visx/scale"
        update-types: ["version-update:semver-major"]
      # @types/node major tracks Node LTS; runtime is pinned to Node 24
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies

  # ── pip: arbiter directories ──
  - package-ecosystem: pip
    directory: /arbiter
    schedule:
      interval: weekly
    groups:
      pip-arbiter-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /arbiter/activator
    schedule:
      interval: weekly
    groups:
      pip-arbiter-activator-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /arbiter/eval_judge
    schedule:
      interval: weekly
    groups:
      pip-arbiter-eval-judge-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /arbiter/fabricator
    schedule:
      interval: weekly
    groups:
      pip-arbiter-fabricator-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # pillow major blocked by upstream dependency cap
      - dependency-name: pillow
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /arbiter/layers/common
    schedule:
      interval: weekly
    groups:
      pip-arbiter-layers-common-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /arbiter/stepRunner
    schedule:
      interval: weekly
    groups:
      pip-arbiter-steprunner-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /arbiter/supervisor
    schedule:
      interval: weekly
    groups:
      pip-arbiter-supervisor-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /arbiter/workerWrapper
    schedule:
      interval: weekly
    groups:
      pip-arbiter-workerwrapper-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # pillow major blocked by upstream dependency cap
      - dependency-name: pillow
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies

  # ── GitHub Actions ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
